services:
  api:
    build:
      context: .
      dockerfile: src/VideoClub.Api/Dockerfile
    container_name: videoclub-api
    ports:
      - "5144:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedOrigins: https://localhost:7115;http://localhost:5294
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=videoclub;Username=videoclub;Password=videoclub123"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: videoclub-db
    environment:
      POSTGRES_DB: videoclub
      POSTGRES_USER: videoclub
      POSTGRES_PASSWORD: videoclub123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoclub -d videoclub"]
      interval: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: src/VideoClub.Client/Dockerfile
    container_name: videoclub-client
    ports:
      - "5294:80"
    environment:
      - API_URL=http://localhost:5144
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - api

  seq:
    image: datalust/seq:latest
    container_name: videoclub-seq
    ports:
      - "5341:5341" 
      - "8081:80"   
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata:


